<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Para Pauly 💜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            background:
                radial-gradient(
                    circle at 50% 40%,
                    #35105f 0%,
                    #17052d 45%,
                    #08000f 100%
                );
            font-family: Arial, sans-serif;
            color: white;
        }
        /* =========================
           ESTRELLAS
        ========================= */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }
        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation:
                twinkle 2s infinite alternate;
        }
        @keyframes twinkle {
            from {
                opacity: .2;
                transform: scale(.7);
            }
            to {
                opacity: 1;
                transform: scale(1.4);
            }
        }
        /* =========================
           TITULO
        ========================= */
        .title {
            position: absolute;
            top: 7%;
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        .title h1 {
            font-size: clamp(
                38px,
                7vw,
                75px
            );
            color: #ffffff;
            text-shadow:
                0 0 10px #ff4fc3,
                0 0 25px #b84cff,
                0 0 50px #8a2be2;
        }
        .title p {
            margin-top: 10px;
            font-size: 18px;
            color: #e9d5ff;
        }
        /* =========================
           ESCENA
        ========================= */
        .scene {
            position: absolute;
            left: 50%;
            top: 43%;
            transform:
                translate(-50%, -50%);
            width: 420px;
            height: 300px;
            z-index: 5;
        }
        /* =========================
           OSOS
        ========================= */
        .bear {
            position: absolute;
            width: 145px;
            height: 175px;
            bottom: 20px;
            border-radius:
                55% 55% 45% 45%;
            animation:
                breathing 3s infinite ease-in-out;
        }
        .bear.left {
            left: 65px;
            background:
                linear-gradient(
                    145deg,
                    #a96338,
                    #71371f
                );
            z-index: 2;
        }
        .bear.right {
            right: 65px;
            background:
                linear-gradient(
                    145deg,
                    #fff0e9,
                    #d9a9a0
                );
            z-index: 3;
        }
        @keyframes breathing {
            0%,100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }
        /* OREJAS */
        .ear {
            position: absolute;
            width: 50px;
            height: 50px;
            top: -20px;
            border-radius: 50%;
        }
        .left .ear {
            background: #8d4b2c;
        }
        .right .ear {
            background: #e4bbb3;
        }
        .ear.one {
            left: 5px;
        }
        .ear.two {
            right: 5px;
        }
        /* OJOS */
        .eye {
            position: absolute;
            top: 65px;
            width: 12px;
            height: 12px;
            background: #25130f;
            border-radius: 50%;
        }
        .left .eye {
            left: 38px;
        }
        .left .eye.two {
            left: 94px;
        }
        .right .eye {
            left: 38px;
        }
        .right .eye.two {
            left: 94px;
        }
        /* HOCICO */
        .muzzle {
            position: absolute;
            left: 50%;
            top: 78px;
            transform:
                translateX(-50%);
            width: 60px;
            height: 45px;
            background: #d49a79;
            border-radius: 50%;
        }
        .right .muzzle {
            background: #f1d2ca;
        }
        .nose {
            position: absolute;
            left: 50%;
            top: 9px;
            transform:
                translateX(-50%);
            width: 17px;
            height: 12px;
            background: #321512;
            border-radius: 50%;
        }
        .mouth {
            position: absolute;
            left: 50%;
            top: 20px;
            transform:
                translateX(-50%);
            width: 20px;
            height: 12px;
            border-bottom:
                3px solid #321512;
            border-radius: 50%;
        }
        /* BRAZOS */
        .arm {
            position: absolute;
            width: 105px;
            height: 42px;
            top: 100px;
            border-radius: 30px;
        }
        .left .arm {
            right: -45px;
            background: #8d4b2c;
            transform:
                rotate(-12deg);
            z-index: 5;
        }
        .right .arm {
            left: -45px;
            background: #e4bbb3;
            transform:
                rotate(12deg);
            z-index: 6;
        }
        /* CORAZÓN ENTRE LOS OSOS */
        .small-heart {
            position: absolute;
            left: 50%;
            top: 20px;
            transform:
                translateX(-50%);
            font-size: 45px;
            animation:
                heartbeat 1.2s infinite;
            z-index: 10;
            filter:
                drop-shadow(
                    0 0 15px #ff4fa3
                );
        }
        @keyframes heartbeat {
            0%,100% {
                transform:
                    translateX(-50%)
                    scale(1);
            }
            50% {
                transform:
                    translateX(-50%)
                    scale(1.25);
            }
        }
        /* =========================
           SUELO
        ========================= */
        .ground {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform:
                translateX(-50%);
            width: 520px;
            height: 90px;
            background:
                radial-gradient(
                    ellipse,
                    #42136d,
                    transparent 70%
                );
            filter:
                blur(5px);
        }
        /* =========================
           CARTA
        ========================= */
        .message {
            position: absolute;
            left: 50%;
            bottom: 5%;
            transform:
                translateX(-50%);
            width: min(
                90%,
                650px
            );
            padding: 25px;
            text-align: center;
            background:
                rgba(30, 5, 55, .65);
            border:
                1px solid
                rgba(220, 150, 255, .35);
            border-radius: 20px;
            backdrop-filter:
                blur(10px);
            box-shadow:
                0 0 30px
                rgba(180, 60, 255, .2);
            z-index: 20;
        }
        .message h2 {
            color: #ff8bd8;
            margin-bottom: 10px;
        }
        .message p {
            color: #eee;
            line-height: 1.6;
            font-size: 16px;
        }
        /* =========================
           BOTÓN
        ========================= */
        button {
            margin-top: 18px;
            padding:
                13px 30px;
            border: none;
            border-radius: 30px;
            background:
                linear-gradient(
                    90deg,
                    #8a2be2,
                    #ff4fc3
                );
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow:
                0 0 20px
                rgba(255, 70, 190, .5);
            transition:
                .3s;
        }
        button:hover {
            transform:
                scale(1.06);
            box-shadow:
                0 0 35px
                rgba(255, 70, 190, .8);
        }
        /* =========================
           CORAZONES FLOTANDO
        ========================= */
        .floating-heart {
            position: fixed;
            bottom: -50px;
            font-size: 20px;
            animation:
                floatUp
                linear forwards;
            pointer-events: none;
            z-index: 30;
        }
        @keyframes floatUp {
            from {
                transform:
                    translateY(0)
                    rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            to {
                transform:
                    translateY(-110vh)
                    rotate(360deg);
                opacity: 0;
            }
        }
        /* =========================
           RESPONSIVE
        ========================= */
        @media (max-width: 600px) {
            .scene {
                transform:
                    translate(-50%, -50%)
                    scale(.72);
            }
            .title {
                top: 5%;
            }
            .title p {
                font-size: 15px;
            }
            .message {
                bottom: 3%;
                padding: 18px;
            }
            .message p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- ESTRELLAS -->
    <div class="stars" id="stars"></div>
    <!-- TITULO -->
    <div class="title">
        <h1>
            Te amo 💜
        </h1>
        <p>
            Mi lugar favorito siempre será contigo.
        </p>
    </div>
    <!-- OSITOS -->
    <div class="scene">
        <div class="ground"></div>
        <div class="bear left">
            <div class="ear one"></div>
            <div class="ear two"></div>
            <div class="eye"></div>
            <div class="eye two"></div>
            <div class="muzzle">
                <div class="nose"></div>
                <div class="mouth"></div>
            </div>
            <div class="arm"></div>
        </div>
        <div class="bear right">
            <div class="ear one"></div>
            <div class="ear two"></div>
            <div class="eye"></div>
            <div class="eye two"></div>
            <div class="muzzle">
                <div class="nose"></div>
                <div class="mouth"></div>
            </div>
            <div class="arm"></div>
        </div>
        <div class="small-heart">
            💗
        </div>
    </div>
    <!-- MENSAJE -->
    <div class="message">
        <h2>
            💌 Para ti, mi amor
        </h2>
        <p>
            No necesito una razón especial para decirte
            cuánto te quiero. Simplemente quería hacerte
            algo que fuera solo nuestro.
        </p>
        <button onclick="loveExplosion()">
            Pulsa aquí ❤️
        </button>
    </div>
    <script>
        /* =========================
           CREAR ESTRELLAS
        ========================= */
        const stars =
            document.getElementById("stars");
        for (
            let i = 0;
            i < 100;
            i++
        ) {
            const star =
                document.createElement("div");
            star.className = "star";
            star.style.left =
                Math.random() * 100 + "%";
            star.style.top =
                Math.random() * 100 + "%";
            star.style.animationDelay =
                Math.random() * 3 + "s";
            star.style.opacity =
                Math.random();
            stars.appendChild(star);
        }
        /* =========================
           CORAZONES
        ========================= */
        function createHeart() {
            const heart =
                document.createElement("div");
            heart.className =
                "floating-heart";
            const hearts =
                ["💜", "💗", "🤍", "💕"];
            heart.innerText =
                hearts[
                    Math.floor(
                        Math.random()
                        * hearts.length
                    )
                ];
            heart.style.left =
                Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (5 + Math.random() * 5)
                + "s";
            heart.style.fontSize =
                (15 + Math.random() * 25)
                + "px";
            document.body.appendChild(
                heart
            );
            setTimeout(() => {
                heart.remove();
            }, 10000);
        }
        setInterval(
            createHeart,
            700
        );
        /* =========================
           EXPLOSIÓN DE AMOR
        ========================= */
        function loveExplosion() {
            for (
                let i = 0;
                i < 30;
                i++
            ) {
                setTimeout(() => {
                    const heart =
                        document.createElement(
                            "div"
                        );
                    heart.className =
                        "floating-heart";
                    heart.innerText =
                        "💜";
                    heart.style.left =
                        (40 +
                        Math.random() * 20)
                        + "vw";
                    heart.style.bottom =
                        "35%";
                    heart.style.fontSize =
                        (20 +
                        Math.random() * 35)
                        + "px";
                    heart.style.animationDuration =
                        (2 +
                        Math.random() * 2)
                        + "s";
                    document.body.appendChild(
                        heart
                    );
                    setTimeout(() => {
                        heart.remove();
                    }, 5000);
                }, i * 60);
            }
        }
    </script>
</body>
</html>
